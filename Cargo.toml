[package]
name = "rscron"
version = "0.1.2"
authors = ["hzb.gg"]
edition = "2024"
description = "rust定时任务库"
license = "MIT"
repository = "https://github.com/hzbnb/rscron"
documentation = "https://docs.rs/rscron"

[dependencies]
croner = { version = "4.0.0", default-features = false, features = ["jiff"] }
jiff = "0.2.35"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tokio-util = { version = "0.7", features = ["rt"] }
